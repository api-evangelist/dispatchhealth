aid: dispatchhealth
name: DispatchHealth
description: 'DispatchHealth is a Denver, Colorado-based provider of complex medical
  care in the home, founded in 2013 and merged with Medically Home in June 2025 to
  create one of the largest hospital-at-home platforms in the United States. The combined
  company delivers same-day urgent care, hospital-alternative (hospital-at-home) care,
  transitional and recovery care across roughly 50 metropolitan areas in partnership
  with nearly 40 health systems and national payers. Its CESIA technology platform
  handles rules-based and AI-assisted care planning, dispatching, routing, scheduling,
  care-team status, real-time two-way patient communications and field equipment tracking,
  and is designed to integrate with a partner health system''s existing EMR rather
  than replace it. DispatchHealth partners access the platform through the Dispatch
  Express portal and patients through an online request flow; the company publishes
  no public developer portal, API documentation, or machine-readable API contract as
  of this profiling pass.'
